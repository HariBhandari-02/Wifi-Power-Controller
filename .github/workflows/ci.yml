name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils

      - name: Byte-compile
        run: python3 -m py_compile wifi-power-toggle.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh

      - name: Validate desktop file
        run: |
          sed "s|@HOME@|$HOME|g" data/wifi-power-controller.desktop.in > /tmp/wifi-power-controller.desktop
          desktop-file-validate /tmp/wifi-power-controller.desktop
